<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===========================
       전역 설정 및 배경 (연한 노란색)
       =========================== */
    body {
      margin: 0;
      padding: 0;
      background-color: #fffde7; 
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh; 
      overflow: hidden; 
    }

    /* ===========================
       휴대폰 그래픽 레이아웃
       =========================== */
    .phone-container {
      width: 100%;
      max-width: 375px;        
      height: 100%;
      max-height: 812px;       
      background-color: #8ba8ca; 
      border: 12px solid #1c1c1c; 
      border-radius: 40px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 아이폰 노치 */
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 140px; height: 25px;
      background-color: #1c1c1c;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      z-index: 30;
    }

    /* 상단 채팅방 이름 영역 */
    .chat-header {
      flex-shrink: 0; 
      height: 85px;
      background-color: transparent; 
      display: flex;
      justify-content: center; 
      align-items: flex-end;
      padding: 0 20px 15px;
      box-sizing: border-box;
      color: #333;
      font-weight: 700;
      font-size: 1.1rem;
      z-index: 25;
    }

    /* ===========================
       채팅창 본문 영역
       =========================== */
    .chat-body {
      flex: 1; 
      min-height: 0; 
      overflow-y: auto; 
      padding: 10px 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth; 
    }
    
    .chat-body::-webkit-scrollbar { width: 5px; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

    /* ===========================
       말풍선 서식
       =========================== */
    .msg-wrapper { 
      display: flex; 
      align-items: flex-end; 
      width: 100%; 
    }
    .msg-wrapper.received { justify-content: flex-start; } 
    .msg-wrapper.sent { justify-content: flex-end; }       

    .bubble {
      max-width: 70%; 
      padding: 8px 12px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word; 
      white-space: pre-wrap; 
      transition: filter 0.2s ease; 
      cursor: default;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .bubble:hover { filter: brightness(0.9); }

    .received .bubble { background-color: #ffffff; color: #333333; border-top-left-radius: 3px; }
    .sent .bubble { background-color: #8de055; color: #111111; border-top-right-radius: 3px; }

    /* ===========================
       하단 입력 영역 (크기 고정)
       =========================== */
    .input-area {
      flex-shrink: 0;
      height: 60px; /* 입력창 높이 고정 (위로 늘어나지 않음) */
      background-color: #f5f5f5;
      display: flex;
      align-items: center; 
      padding: 0 15px;
      box-sizing: border-box;
      gap: 8px;
      z-index: 5;
      border-top: 1px solid #e0e0e0;
    }
    
    /* 발신인/수신인 토글 버튼 */
    .toggle-btn {
      flex-shrink: 0; 
      width: 85px;    
      height: 38px;
      border: none;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      background-color: #8de055;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .toggle-btn.other { background-color: #ffffff; color: #333; border: 1px solid #ccc; }

    /* 텍스트 입력 칸 */
    .real-input {
      flex: 1;
      min-width: 0; 
      height: 38px; /* 크기 고정 */
      background-color: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 0.95rem;
      outline: none;
      resize: none; 
      overflow-y: auto;
      font-family: inherit;
      box-sizing: border-box;
      line-height: 1.4;
    }

    /* 전송 버튼 */
    .real-send-btn {
      flex-shrink: 0; 
      width: 38px; height: 38px;
      background-color: #007aff;
      border: none;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .real-send-btn:hover { opacity: 0.8; }
    .real-send-btn:active { transform: scale(0.9); } 

    @media (max-width: 500px) {
      .phone-container { max-width: 100vw; max-height: 100vh; border: none; border-radius: 0; }
      .notch { display: none; }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="notch"></div>

    <div class="chat-header">
      <span>イタダ</span>
    </div>

    <!-- 채팅 본문 영역 (텅 비워둠) -->
    <div class="chat-body" id="chat-box">
    </div>

    <!-- 하단 입력창 -->
    <div class="input-area">
      <button class="toggle-btn" id="sender-toggle" onclick="toggleSender()">나 (송신)</button>
      <textarea class="real-input" id="message-input" placeholder="메시지 입력..." onkeydown="handleKeyDown(event)"></textarea>
      <button class="real-send-btn" onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    let isMe = true;

    // 화자 전환 (나/상대)
    function toggleSender() {
      const toggleBtn = document.getElementById('sender-toggle');
      isMe = !isMe; 

      if (isMe) {
        toggleBtn.textContent = '나 (송신)';
        toggleBtn.classList.remove('other');
      } else {
        toggleBtn.textContent = '상대 (수신)';
        toggleBtn.classList.add('other');
      }
      document.getElementById('message-input').focus();
    }

    // 엔터키 처리 (한국어 입력 오류 완벽 수정)
    function handleKeyDown(event) {
      // 조합 중인 상태(IME)일 때는 엔터키 이벤트를 무시하여 두 번 전송되는 것을 막음
      if (event.isComposing) {
        return; 
      }
      
      // Shift를 누르지 않은 상태에서 Enter를 누르면 전송
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault(); // 줄바꿈 방지
        sendMessage();
      }
    }

    // 메시지 전송 기능
    function sendMessage() {
      const inputField = document.getElementById('message-input');
      const chatBox = document.getElementById('chat-box');
      const text = inputField.value.trim(); 

      // 빈 텍스트면 전송 안 함
      if (text === '') {
        inputField.value = '';
        return;
      }

      // 메시지 컨테이너 생성
      const msgWrapper = document.createElement('div');
      msgWrapper.classList.add('msg-wrapper');
      
      if (isMe) {
        msgWrapper.classList.add('sent');
      } else {
        msgWrapper.classList.add('received');
      }

      // 말풍선 생성
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.textContent = text; 

      // 화면에 추가
      msgWrapper.appendChild(bubble);
      chatBox.appendChild(msgWrapper);

      // 입력창 초기화
      inputField.value = '';

      // 메시지가 추가된 후 스크롤을 맨 아래로 이동
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }
  </script>
</body>
</html>
