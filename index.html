<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===========================
       전역 설정 및 배경 (연한 노란색)
       =========================== */
    body {
      margin: 0;
      padding: 0;
      background-color: #fffde7; /* 연한 노란색 배경 */
      font-family: 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden; 
    }

    /* ===========================
       휴대폰 그래픽 레이아웃
       =========================== */
    .phone-container {
      width: 100%;
      max-width: 375px;        
      height: 100%;
      max-height: 812px;       
      background-color: #8ba8ca; 
      border: 12px solid #1c1c1c; 
      border-radius: 40px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 아이폰 노치 */
    .notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 140px; height: 25px;
      background-color: #1c1c1c;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      z-index: 30;
    }

    /* 상단 채팅방 이름 영역 */
    .chat-header {
      height: 85px;
      background-color: transparent; 
      display: flex;
      justify-content: center; 
      align-items: flex-end;
      padding: 0 20px 15px;
      box-sizing: border-box;
      color: #333;
      font-weight: 700;
      font-size: 1.1rem;
      z-index: 25;
    }

    /* ===========================
       채팅창 본문 영역
       =========================== */
    .chat-body {
      flex: 1;
      overflow-y: auto; 
      padding: 10px 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth; 
    }
    
    .chat-body::-webkit-scrollbar { width: 5px; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

    /* ===========================
       말풍선 서식
       =========================== */
    .msg-wrapper { 
      display: flex; 
      align-items: flex-end; 
      width: 100%; 
    }
    .msg-wrapper.received { justify-content: flex-start; } 
    .msg-wrapper.sent { justify-content: flex-end; }       

    .bubble {
      max-width: 70%; 
      padding: 8px 12px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word; 
      white-space: pre-wrap; /* 줄바꿈(엔터)이 그대로 표시되도록 설정 */
      transition: filter 0.2s ease; 
      cursor: default;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .bubble:hover { filter: brightness(0.9); }

    .received .bubble { background-color: #ffffff; color: #333333; border-top-left-radius: 3px; }
    .sent .bubble { background-color: #8de055; color: #111111; border-top-right-radius: 3px; }

    /* ===========================
       하단 실제 입력창 영역
       =========================== */
    .input-area {
      min-height: 70px;
      background-color: #f5f5f5;
      display: flex;
      align-items: flex-end; /* 텍스트창이 길어지면 버튼들이 아래 바닥에 정렬되도록 */
      padding: 10px 15px 15px 15px;
      box-sizing: border-box;
      gap: 8px;
      z-index: 5;
    }
    
    /* 발신인/수신인 토글 버튼 */
    .toggle-btn {
      flex-shrink: 0; /* 밀림 방지 */
      width: 85px;    /* 너비 고정 (글씨가 바뀌어도 크기 안 변함) */
      height: 38px;
      border: none;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      background-color: #8de055;
      transition: background-color 0.2s, color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .toggle-btn.other {
      background-color: #ffffff;
      color: #333;
      border: 1px solid #ccc;
    }

    /* 자동으로 늘어나는 텍스트 입력 칸 (textarea 적용) */
    .real-input {
      flex: 1;
      min-width: 0; /* flex 환경에서 찌그러짐 방지 */
      min-height: 38px;
      max-height: 120px; /* 너무 길어지면 입력창 안에서 스크롤됨 */
      background-color: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 0.95rem;
      outline: none;
      resize: none; /* 유저가 임의로 크기 조절 못하게 막음 */
      overflow-y: auto;
      font-family: inherit;
      box-sizing: border-box;
      line-height: 1.4;
    }

    /* 전송 버튼 */
    .real-send-btn {
      flex-shrink: 0; /* 밀림 방지 */
      width: 38px; height: 38px;
      background-color: #007aff;
      border: none;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .real-send-btn:hover { opacity: 0.8; }

    @media (max-width: 500px) {
      .phone-container { max-width: 100vw; max-height: 100vh; border: none; border-radius: 0; }
      .notch { display: none; }
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="notch"></div>

    <div class="chat-header">
      <span>イタダ</span>
    </div>

    <!-- 채팅 본문 영역 -->

    <!-- 하단 입력창 -->
    <div class="input-area">
      <!-- 토글 버튼 -->
      <button class="toggle-btn" id="sender-toggle" onclick="toggleSender()">나 (송신)</button>
      
      <!-- 텍스트 입력칸 (글자가 길어지면 위로 늘어남) -->
      <textarea class="real-input" id="message-input" rows="1" placeholder="메시지 입력..." oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
      
      <!-- 전송 버튼 -->
      <button class="real-send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    let isMe = true;

    // 말하는 사람(발신/수신)을 바꾸는 함수
    function toggleSender() {
      const toggleBtn = document.getElementById('sender-toggle');
      isMe = !isMe; 

      if (isMe) {
        toggleBtn.textContent = '나 (송신)';
        toggleBtn.classList.remove('other');
      } else {
        toggleBtn.textContent = '상대 (수신)';
        toggleBtn.classList.add('other');
      }
      
      document.getElementById('message-input').focus();
    }

    // 입력창 글자 길이에 맞춰 높이를 자동으로 늘려주는 함수
    function autoResize(textarea) {
      textarea.style.height = 'auto'; // 높이 초기화
      textarea.style.height = textarea.scrollHeight + 'px'; // 들어간 내용물의 스크롤 높이만큼 재설정
    }

    // 엔터키 처리 함수 (Shift+Enter는 줄바꿈, 그냥 Enter는 전송)
    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault(); // 기본 엔터(줄바꿈) 작동 방지
        sendMessage();
      }
    }

    // 메시지를 화면에 추가하는 함수
    function sendMessage() {
      const inputField = document.getElementById('message-input');
      const chatBox = document.getElementById('chat-box');
      const text = inputField.value.trim(); // 양쪽 공백 제거

      if (text === '') {
        // 전송 후 빈칸일 때 높이를 리셋하기 위한 예외처리
        inputField.value = '';
        inputField.style.height = 'auto';
        return;
      }

      // 새 메시지를 담을 컨테이너
      const msgWrapper = document.createElement('div');
      msgWrapper.classList.add('msg-wrapper');
      
      if (isMe) {
        msgWrapper.classList.add('sent');
      } else {
        msgWrapper.classList.add('received');
      }

      // 말풍선 만들기
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      bubble.textContent = text; 

      msgWrapper.appendChild(bubble);
      chatBox.appendChild(msgWrapper);

      // 텍스트 비우고 입력창 높이 원래대로 복구
      inputField.value = '';
      inputField.style.height = 'auto';

      // 가장 최근 메시지(맨 아래)로 스크롤 이동
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
