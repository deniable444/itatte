<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라인잘타기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background-color: #fffde7; font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; }
    .phone-container { width: 100%; max-width: 375px; height: 100%; max-height: 812px; background-color: #8ba8ca; border: 12px solid #1c1c1c; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); position: relative; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
    .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 25px; background-color: #1c1c1c; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 30; }
    .chat-header { flex-shrink: 0; height: 85px; background-color: transparent; display: flex; justify-content: center; align-items: flex-end; padding: 0 20px 15px; box-sizing: border-box; color: #333; font-weight: 700; font-size: 1.1rem; z-index: 25; }
    .chat-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 15px 20px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .chat-body::-webkit-scrollbar { width: 5px; }
    .chat-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    .msg-wrapper { display: flex; align-items: flex-end; width: 100%; }
    .msg-wrapper.received { justify-content: flex-start; }
    .msg-wrapper.sent { justify-content: flex-end; }
    .bubble { max-width: 70%; padding: 8px 12px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; white-space: pre-wrap; transition: filter 0.2s ease; cursor: default; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .bubble:hover { filter: brightness(0.9); }
    .received .bubble { background-color: #ffffff; color: #333333; border-top-left-radius: 3px; }
    .sent .bubble { background-color: #8de055; color: #111111; border-top-right-radius: 3px; }
    .date-divider { align-self: center; background-color: rgba(0,0,0,0.15); color: #ffffff; padding: 5px 15px; border-radius: 20px; font-size: 0.75rem; margin: 15px 0; }
    .input-wrapper { flex-shrink: 0; background-color: #f5f5f5; display: flex; flex-direction: column; z-index: 5; border-top: 1px solid #e0e0e0; }
    .input-toolbar { display: flex; justify-content: flex-start; padding: 10px 15px 0 15px; }
    .tool-btn { font-size: 0.75rem; padding: 5px 12px; border-radius: 15px; border: 1px solid #ccc; background: #ffffff; color: #555; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .tool-btn:hover { background: #e0e0e0; }
    .input-area { height: 60px; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; gap: 8px; }
    .toggle-btn { flex-shrink: 0; width: 85px; height: 38px; border: none; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: #111; background-color: #8de055; transition: background-color 0.2s, color 0.2s; display: flex; justify-content: center; align-items: center; }
    .toggle-btn.other { background-color: #ffffff; color: #333; border: 1px solid #ccc; }
    .real-input { flex: 1; min-width: 0; height: 38px; background-color: #ffffff; border: 1px solid #dddddd; border-radius: 20px; padding: 8px 15px; font-size: 0.95rem; outline: none; resize: none; overflow-y: auto; font-family: inherit; box-sizing: border-box; line-height: 1.4; }
    .real-send-btn { flex-shrink: 0; width: 38px; height: 38px; background-color: #007aff; border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 16px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
    .real-send-btn:hover { opacity: 0.8; }
    .real-send-btn:active { transform: scale(0.9); }
    @media (max-width: 500px) { .phone-container { max-width: 100vw; max-height: 100vh; border: none; border-radius: 0; } .notch { display: none; } }
    /* reCAPTCHA v3 배지는 화면을 가리지 않도록 숨김 (Google 정책상 안내 문구는 아래에 표시) */
    .grecaptcha-badge { visibility: hidden; }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="notch"></div>
    <div class="chat-header"><span>イタダ</span></div>
    <div class="chat-body" id="chat-box"></div>
    <div class="input-wrapper">
      <div class="input-toolbar">
        <button class="tool-btn" onclick="insertDivider()">＋ 구분선 추가</button>
      </div>
      <div class="input-area">
        <button class="toggle-btn" id="sender-toggle" onclick="toggleSender()">나 (송신)</button>
        <textarea class="real-input" id="message-input" placeholder="메시지 입력..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="real-send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBy_5jtz_gXWDHRMBSN2iNMi-IzoncPn-0",
      authDomain: "itdd-7376a.firebaseapp.com",
      projectId: "itdd-7376a",
      storageBucket: "itdd-7376a.firebasestorage.app",
      messagingSenderId: "825958758941",
      appId: "1:825958758941:web:3b772bef5f723a6ba324f4",
      measurementId: "G-C5J8KHC6LW"
    };

    // ▼▼▼ reCAPTCHA v3 사이트 키로 교체하세요 ▼▼▼
    const RECAPTCHA_SITE_KEY = "6LffTOgtAAAAAItsV4vGEskkWjr-jVrU5sGqZICN";

    const app = initializeApp(firebaseConfig);

    // 1) App Check: 반드시 다른 Firebase 서비스보다 먼저 초기화
    initializeAppCheck(app, {
      provider: new ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
      isTokenAutoRefreshEnabled: true
    });

    const auth = getAuth(app);
    const db = getDatabase(app);
    const chatRef = ref(db, 'public_chat');

    let isMe = true;
    let ready = false;        // 익명 로그인 완료 여부
    const pending = [];       // 로그인 완료 전에 보낸 메시지 대기열

    // 2) 익명 로그인: 접속하면 자동으로 처리 (사용자는 아무것도 안 해도 됨)
    //    한 번 로그인하면 브라우저에 저장되어 다음 방문 때도 그대로 유지됨
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (ready) return;
        ready = true;
        startListening();
        while (pending.length) push(chatRef, pending.shift());
      } else {
        signInAnonymously(auth).catch((err) => {
          console.error("익명 로그인 실패:", err);
          setTimeout(() => signInAnonymously(auth).catch(() => {}), 3000);
        });
      }
    });

    function send(data) {
      if (ready) push(chatRef, data).catch((e) => console.error("전송 실패:", e));
      else pending.push(data);
    }

    window.toggleSender = function() {
      const toggleBtn = document.getElementById('sender-toggle');
      isMe = !isMe;
      if (isMe) {
        toggleBtn.textContent = '나 (송신)';
        toggleBtn.classList.remove('other');
      } else {
        toggleBtn.textContent = '상대 (수신)';
        toggleBtn.classList.add('other');
      }
      document.getElementById('message-input').focus();
    };

    window.handleKeyDown = function(event) {
      if (event.isComposing) return;
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        window.sendMessage();
      }
    };

    window.sendMessage = function() {
      const inputField = document.getElementById('message-input');
      const text = inputField.value.trim();
      inputField.value = '';
      if (text === '') return;
      send({ type: 'msg', text: text.slice(0, 1000), isMe: isMe, timestamp: Date.now() });
    };

    window.insertDivider = function() {
      const text = prompt("구분선에 들어갈 내용을 입력하세요.");
      if (text && text.trim() !== '') {
        send({ type: 'divider', text: text.trim().slice(0, 1000), timestamp: Date.now() });
      }
    };

    // 로그인 완료 후에 읽기 시작 (규칙에서 로그인 안 한 읽기를 차단하므로)
    function startListening() {
      onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        const chatBox = document.getElementById('chat-box');

        if (data.type === 'msg') {
          const msgWrapper = document.createElement('div');
          msgWrapper.classList.add('msg-wrapper', data.isMe ? 'sent' : 'received');
          const bubble = document.createElement('div');
          bubble.classList.add('bubble');
          bubble.textContent = data.text;
          msgWrapper.appendChild(bubble);
          chatBox.appendChild(msgWrapper);
        } else if (data.type === 'divider') {
          const div = document.createElement('div');
          div.className = 'date-divider';
          div.textContent = data.text;
          chatBox.appendChild(div);
        }

        requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
      });
    }
  </script>
</body>
</html>
